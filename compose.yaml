services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules # keep using node_modules of the container to avoid host OS malfunctions

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports:
      - "5173:5173"